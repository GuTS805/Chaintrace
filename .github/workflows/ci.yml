name: CI

# Every gate here is one that already runs locally, so a red build means a real
# regression rather than a CI-only quirk.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  # A new push supersedes an in-flight run on the same ref.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Offline test/migration path: SQLite, no Postgres or Redis service needed.
  DATABASE_URL: sqlite+aiosqlite:///./ci.db

jobs:
  backend:
    name: backend (lint · types · tests · migrations)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Pinned to the version the suite is developed and verified against.
          # pyproject declares >=3.11; widening this to a matrix that covers the
          # declared floor is a separate, deliberate change.
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Types (mypy strict)
        run: mypy

      - name: Tests
        run: pytest -q

      - name: Migrations apply and match the models
        # `alembic check` fails when the ORM models have drifted from what the
        # migrations actually build — the failure mode that silently ships a
        # column the deployed database does not have.
        run: |
          alembic upgrade head
          alembic check

      - name: Migrations are reversible
        run: |
          alembic downgrade base
          alembic upgrade head

  frontend:
    name: frontend (types · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Types
        run: npm run typecheck

      - name: Build
        run: npm run build
